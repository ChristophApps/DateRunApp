<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MünzApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;font-size:10px;-webkit-text-size-adjust:100%}
.toolbar{position:sticky;top:0;z-index:100;background:#2c3e50;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar h1{color:#fff;font-size:15px;margin-right:10px;white-space:nowrap}
.toolbar button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:4px 8px;border-radius:3px;font-size:11px;cursor:pointer}
.wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 42px)}
table{border-collapse:collapse;table-layout:fixed}
td{border:1.5px solid #999;padding:1px 3px;white-space:nowrap;text-align:center;font-weight:bold;font-size:9px;height:17px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
td:active{opacity:.7}
.c-country{background:#FF543E;color:#fff;font-size:11px;text-align:left;padding:3px 6px;font-weight:bold;border:1.5px solid #999}
.c-hdr{background:#000;color:#fff;font-size:8px;padding:2px 3px;text-align:center}
.c-hdr-den{background:#000;color:#fff;font-size:8px;padding:2px 3px}
.c-hdr-cc{background:#000;color:#fff;font-size:6px;padding:2px 3px}
.c-year{background:#000;color:#fff;font-size:8px}
.c-green{background:#C6E0B4}
.c-red{background:#FFC7CE}
.c-empty{color:#ccc}
.c-legend{font-size:8px;text-align:left;padding:2px 6px}
.gap{min-width:3px;max-width:3px;background:#eee;border:none!important;cursor:default!important}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 14px;border-radius:5px;font-size:12px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:350px;max-height:85vh;overflow-y:auto;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.modal h2{font-size:14px;margin-bottom:2px}
.modal .sub{font-size:11px;color:#888;margin-bottom:10px}
.modal .pv{background:#f5f5f5;border-radius:6px;padding:10px;text-align:center;font-size:20px;font-weight:bold;margin:10px 0}
.modal label{font-size:10px;font-weight:600;color:#555;display:block;margin:8px 0 3px}
.modal .br{display:flex;gap:3px;flex-wrap:wrap}
.modal .br button{flex:1;min-width:36px;padding:6px 3px;border-radius:4px;border:2px solid #ddd;background:#fff;font-size:12px;cursor:pointer;text-align:center;font-weight:bold}
.modal .br button.sel{border-color:#3498db;background:#ebf5fb}
.modal input[type="text"]{width:100%;padding:6px 8px;border:2px solid #ddd;border-radius:4px;font-size:14px;text-align:center}
.ma{display:flex;gap:5px;margin-top:12px}
.ma button{flex:1;padding:8px;border-radius:5px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.btn-apply{background:#3498db;color:#fff}
.btn-clear{background:#f5b7b1;color:#c0392b}
.btn-cancel{background:#ecf0f1;color:#555}
</style>
</head>
<body>
<div class="toolbar">
<h1>MünzApp</h1>
<button onclick="document.getElementById('fi').click()">Excel Import</button>
<input type="file" id="fi" accept=".xlsx,.xls" style="display:none">
<button onclick="expJSON()">JSON Export</button>
<button onclick="document.getElementById('ji').click()">JSON Import</button>
<input type="file" id="ji" accept=".json" style="display:none">
<button onclick="window.print()">PDF</button>
<button onclick="toggleLegend()">Legende</button>
</div>
<div class="wrap" id="wrap"></div>
<div id="toast" class="toast"></div>

<div id="editor-modal" class="modal-overlay">
<div class="modal">
<h2 id="et">Zelle</h2><div class="sub" id="es"></div>
<div class="pv" id="epv">(leer)</div>
<label>Basis</label><div class="br">
<button onclick="sBase('')" style="color:#999">leer</button>
<button onclick="sBase('✔')" style="background:#C6E0B4">&#10003;</button>
<button onclick="sBase('✕')" style="background:#FFC7CE">&#10005;</button>
<button onclick="sBase('0')" style="background:#D5E8D4">0</button>
<button onclick="sBase('1')">1</button>
<button onclick="sBase('3')">3</button>
<button onclick="sBase('5')">5</button>
</div>
<label>Herkunft</label><div class="br">
<button onclick="aCode('x')">x</button><button onclick="aCode('y')">y</button>
<button onclick="aCode('z')">z</button><button onclick="aCode('°')">°</button>
<button onclick="aCode('*')">*</button><button onclick="aCode('’')">'</button>
</div>
<label>Eigener Text</label>
<input type="text" id="ei" placeholder="z.B. 0*, 5°..." inputmode="text" autocomplete="off">
<div class="ma">
<button class="btn-apply" onclick="appEdit()">Übernehmen</button>
<button class="btn-clear" onclick="clrEdit()">Leeren</button>
<button class="btn-cancel" onclick="closeEditor()">Abbrechen</button>
</div></div></div>

1}, {"s": "N219", "e": "R219", "sr": 219, "sc": 13, "er": 219, "ec": 17}, {"s": "N218", "e": "R218", "sr": 218, "sc": 13, "er": 218, "ec": 17}, {"s": "N220", "e": "R220", "sr": 220, "sc": 13, "er": 220, "ec": 17}, {"s": "N221", "e": "R221", "sr": 221, "sc": 13, "er": 221, "ec": 17}, {"s": "N223", "e": "R223", "sr": 223, "sc": 13, "er": 223, "ec": 17}, {"s": "C218", "e": "L218", "sr": 218, "sc": 2, "er": 218, "ec": 11}, {"s": "C219", "e": "L219", "sr": 219, "sc": 2, "er": 219, "ec": 11}, {"s": "C220", "e": "L220", "sr": 220, "sc": 2, "er": 220, "ec": 11}, {"s": "C221", "e": "L221", "sr": 221, "sc": 2, "er": 221, "ec": 11}, {"s": "T218", "e": "AC218", "sr": 218, "sc": 19, "er": 218, "ec": 28}, {"s": "T219", "e": "AC219", "sr": 219, "sc": 19, "er": 219, "ec": 28}, {"s": "T221", "e": "AC221", "sr": 221, "sc": 19, "er": 221, "ec": 28}, {"s": "T222", "e": "AC222", "sr": 222, "sc": 19, "er": 222, "ec": 28}, {"s": "T223", "e": "AC223", "sr": 223, "sc": 19, "er": 223, "ec": 28}];
    const skip = new Set();
    const mstart = {};
    for (const m of merges) {
        const sc = m['s'].match(/[A-Z]+/)[0], sr = parseInt(m['s'].match(/\d+/)[0]);
        const ec = m['e'].match(/[A-Z]+/)[0], er = parseInt(m['e'].match(/\d+/)[0]);
        const sn = colNum(sc), en = colNum(ec);
        const cs = en - sn + 1, rs = er - sr + 1;
        for (let r = sr; r <= er; r++) {
            for (let c = sn; c <= en; c++) {
                let cl = '';
                let n = c;
                while (n >= 0) { cl = String.fromCharCode(65 + n % 26) + cl; n = Math.floor(n / 26) - 1; }
                const ref = cl + r;
                if (r === sr && c === sn) {
                    const val = DATA[ref] !== undefined ? DATA[ref] : '';
                    mstart[ref] = {cs, rs, v: val};
                } else {
                    skip.add(ref);
                }
            }
        }
    }
    
    for (let r = 1; r <= 231; r++) {
        h += '<tr>';
        for (let ci = 0; ci < cols.length; ci++) {
            const cl = cols[ci];
            const ref = cl + r;
            if (skip.has(ref)) continue;
            
            let cs = 1, rs = 1, val = '';
            let isMerge = false;
            if (mstart[ref]) {
                const m = mstart[ref];
                cs = m.cs; rs = m.rs; val = m.v;
                isMerge = true;
            } else {
                val = DATA[ref] !== undefined ? DATA[ref] : '';
            }
            
            let cls = '';
            if (isMerge && (val === 'Österreich' || val === 'Italien' || val === 'Frankreich' || val === 'Spanien' || val === 'Finnland' ||
                val === 'Belgien' || val === 'Niederlande' || val === 'Luxemburg' || val === 'Irland' || val === 'Griechenland' ||
                val === 'Portugal' || val === 'Slowenien' || val === 'Malta' || val === 'Zypern' || val === 'Slowakei' || val === 'Estland' ||
                val === 'Lettland' || val === 'Litauen/Lietuva' || val === 'Kroatien' || val === 'Bulgarien' || val === 'Andorra' ||
                val === 'San Marino' || val === 'Monaca' || val === 'Vatikan')) {
                cls = 'c-country';
            } else if (r === 1 && isMerge && val.trim()) {
                cls = 'c-country';
            } else if (r === 2) {
                if (val === '1c' || val === '2c' || val === '5c' || val === '10c' || val === '20c' || val === '50c' || val === '1' || val === '2') {
                    cls = 'c-hdr-den';
                } else if (val === 'CC1' || val === 'CC2' || val === 'CCC') {
                    cls = 'c-hdr-cc';
                } else {
                    cls = 'c-hdr';
                }
            }
            
            // Gap columns (non-interactive separators)
            const isGap = cl === 'N' || cl === 'AB' || cl === 'AP' || cl === 'AQ' || cl === 'AR' || cl === 'AS';
            if (isGap) cls = 'gap';
            const a = `data-ref="${ref}"`;
            const o = isGap ? '' : `onclick="editCell(this,'${ref}')"`;
            
            // Data-driven colors (only for non-gap editable cells)
            if (!cls && val) {
                if (val === '✔' || val.includes('✔')) cls = 'c-green';
                else if (val === '✕') cls = 'c-red';
                else if (val.startsWith('0')) cls = 'c-green';
            }
            
            if (cs > 1 || rs > 1) {
                h += `<td class="${cls}" colspan="${cs}" rowspan="${rs}" ${a} ${o}>${val}</td>`;
            } else {
                h += `<td class="${cls}" ${a} ${o}>${val}</td>`;
            }
        }
        h += '</tr>';
    }
    h += '</table>';
    wrap.innerHTML = h;
}

function editCell(td, ref) {
    curCell = td; curRef = ref;
    const val = DATA[ref] || '';
    document.getElementById('et').textContent = 'Zelle ' + ref;
    document.getElementById('epv').textContent = val || '(leer)';
    document.getElementById('ei').value = val || '';
    document.getElementById('editor-modal').classList.add('active');
}

function sBase(v) {
    document.getElementById('ei').value = v;
    document.getElementById('epv').textContent = v || '(leer)';
}

function aCode(c) {
    const inp = document.getElementById('ei');
    let v = inp.value;
    if (v.includes(c)) { toast('Bereits vorhanden'); return; }
    v += c; inp.value = v;
    document.getElementById('epv').textContent = v || '(leer)';
}

function appEdit() {
    const v = document.getElementById('ei').value;
    DATA[curRef] = v || '';
    if (curCell) {
        curCell.textContent = v;
        // Update style
        curCell.className = '';
        if (v === '✔' || v.includes('✔')) curCell.classList.add('c-green');
        else if (v === '✕') curCell.classList.add('c-red');
        else if (v.startsWith('0')) curCell.classList.add('c-green');
    }
    localStorage.setItem('md', JSON.stringify(DATA));
    closeEditor(); toast('Gespeichert');
}

function clrEdit() {
    if (curRef) { DATA[curRef] = ''; }
    if (curCell) { curCell.textContent = ''; curCell.className = ''; }
    localStorage.setItem('md', JSON.stringify(DATA));
    closeEditor(); toast('Gelöscht');
}

function closeEditor() {
    document.getElementById('editor-modal').classList.remove('active');
    curCell = null; curRef = '';
}

document.getElementById('editor-modal').addEventListener('click', function(e) { if (e.target === this) closeEditor(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeEditor(); });

function toast(m) {
    const el = document.getElementById('toast');
    el.textContent = m; el.classList.add('show');
    clearTimeout(el._timer); el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

function expJSON() {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'muenzapp_data.json'; a.click();
    URL.revokeObjectURL(a.href);
}

document.getElementById('ji').addEventListener('change', function(e) {
    if (!e.target.files[0]) return;
    const r = new FileReader();
    r.onload = function(ev) {
        try { DATA = JSON.parse(ev.target.result); localStorage.setItem('md', JSON.stringify(DATA)); render(); toast('Importiert'); }
        catch(err) { toast('Fehler: '+err.message); }
    }; r.readAsText(e.target.files[0]); e.target.value = '';
});

document.getElementById('fi').addEventListener('change', function(e) {
    if (!e.target.files[0]) return;
    const r = new FileReader();
    r.onload = function(ev) {
        try {
            const wb = XLSX.read(ev.target.result, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            if (!ws) { toast('Kein Sheet'); return; }
            const ref = ws['!ref']; if (!ref) { toast('Leer'); return; }
            const range = XLSX.utils.decode_range(ref);
            DATA = {};
            for (let r = range.s.r; r <= range.e.r; r++) {
                for (let c = range.s.c; c <= range.e.c; c++) {
                    const addr = XLSX.utils.encode_cell({r,c});
                    const cell = ws[addr];
                    if (cell) {
                        const col = XLSX.utils.encode_col(c);
                        const row = r + 1;
                        const ref2 = col + row;
                        DATA[ref2] = String(cell.v ?? '');
                    }
                }
            }
            localStorage.setItem('md', JSON.stringify(DATA));
            render(); toast('Excel importiert');
        } catch(err) { toast('Fehler: '+err.message); }
    }; r.readAsArrayBuffer(e.target.files[0]); e.target.value = '';
});

function toggleLegend() {
    const el = document.getElementById('legend');
    if (!el) return;
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
